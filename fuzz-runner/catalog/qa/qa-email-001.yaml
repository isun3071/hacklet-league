id: qa-email-001
bundle: qa
category: email-verification
pool: public
evidence_model: provable
# REPORT_ONLY in v1 (the predicate forces off-score) until the corpus admission-test validates the family;
# the severity below is what it takes once promoted. Rationale: signup is email-verification-gated but the
# confirmation email never arrives -> the user can register and then never verify, so they are locked out. A
# broken core promise (Nielsen 4 catastrophe), and binary (locked out or not), so there is no scope to escalate.
severity: {iso_25010: "reliability", nielsen: "4", range: [55, 55], default: 55}
applicability:
  requires: [has_auth_entrypoint]
probe:
  predicate: email_never_arrives
tp_definition: |
  TP: signup announces / requires email confirmation (or a confirmation email actually arrives), and no email
  reaches the address we registered within the timeout -> the account can never be verified -> locked out.
  NOT (confounders): signup is not email-gated (it logs in immediately, or just wants a separate login with no
  confirm-email language and no mail) -> N/A, not a fire; a CAPTCHA/SSO blocks registration -> N/A.
